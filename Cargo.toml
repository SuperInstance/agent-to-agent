[package]
name = "agent-to-agent"
version = "0.1.0"
edition = "2021"
description = "Google A2A (Agent-to-Agent) protocol implementation in Rust — inter-agent communication, capability discovery, task delegation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/agent-to-agent"
keywords = ["a2a", "agent", "protocol", "google", "ai"]
categories = ["network-programming", "api-bindings", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
